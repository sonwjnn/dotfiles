# Migrated from Alacritty (~/.config/alacritty/alacritty.toml)

# Font
font_family GeistMono Nerd Font
font_size 16
adjust_line_height 9
adjust_column_width 0
font_style Regular
font_features none

# Window
window_padding_width 12
hide_window_decorations yes
background_opacity 0.95
background_blur 95

# Scrollback
scrollback_lines 100000

# Cursor
cursor_shape block
cursor_blink_interval 0

# Colors
#include themes/catppuccin-mocha.conf

# Keyboard — herdr/nvim own the cmd chords.
#
# clear_all_shortcuts is REQUIRED here: `map cmd+x no_op` does NOT remove
# kitty's built-in binding, it only appends an empty definition alongside it.
# The default action also stays registered as a macOS menu-bar key equivalent
# (cmd+h -> hide_macos_app, cmd+t -> new_tab, ...), and macOS consumes those
# before kitty's key handling runs — so no_op never gets a chance.
clear_all_shortcuts yes
# kitty-level essentials, re-added explicitly.
map cmd+q quit
map cmd+n new_os_window
map cmd+v paste_from_clipboard
# map cmd+f search_scrollback
map cmd+, edit_config_file
map ctrl+cmd+, load_config_file
map cmd+= change_font_size all +2.0
map cmd+- change_font_size all -2.0
map cmd+0 change_font_size all 0
map opt+cmd+h hide_macos_app
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map shift+enter send_text all \x1b\r


# Scrollback
scrollback_lines 100000

# Cursor
cursor_shape block
cursor_blink_interval 0

# Colors
include themes/catppuccin-mocha.conf

# Force kitty terminfo (needed for image protocol detection)
env TERM=kitty

# Force fish as shell (AeroSpace/launchd launches kitty with zsh otherwise)
shell /opt/homebrew/bin/fish
