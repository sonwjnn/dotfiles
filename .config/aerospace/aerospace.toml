# AEROSPACE CONFIG
#https://github.com/edunfelt/base17-rose-pine-scheme/blob/main/assets/palette.png
start-at-login = true

after-login-command = []

after-startup-command = [
     'exec-and-forget /opt/homebrew/opt/borders/bin/borders active_color=0xFFFFBE6A inactive_color=0xFF007692 width=8.0',
     # 'exec-and-forget exec ~/.config/aerospace/center-app/bin/center-app --watch-wake com.valvesoftware.steam.helper net.kovidgoyal.kitty com.mitchellh.ghostty'
]

exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  '~/.config/aerospace/pip-follow.sh'
]

on-focused-monitor-changed = [
  'move-mouse monitor-lazy-center'
]

on-focus-changed = [
  'move-mouse window-lazy-center',
  'exec-and-forget ~/.config/aerospace/bitwarden-float-size.sh'
]

enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

accordion-padding = 31

default-root-container-layout = 'tiles'

default-root-container-orientation = 'auto'

key-mapping.preset = 'qwerty'

# Bind workspaces tới monitor cứng theo tên monitor.
# Built-in Retina Display: 1-6; HDMI: 7-8 and 11; ARZOPA: 0, 9-10.
[workspace-to-monitor-force-assignment]
0 = "ARZOPA"
1 = "built-in"
2 = "built-in"
3 = "built-in"
4 = "built-in"
5 = "built-in"
6 = "built-in"
7 = "HDMI"
8 = "HDMI"
9 = "ARZOPA"
10 = "ARZOPA"
11 = "HDMI"

[gaps]
#outer.bottom numbers have to match presentation.sh variables. built-in retina display is excluded from presentation mode, so this only works on external monitors.
outer.bottom =     11
outer.top =        6
outer.left =       11
outer.right =      11
inner.horizontal = 11
inner.vertical =   11

[exec]                   # Again, you don't need to copy all config sections to your config.
inherit-env-vars = true  # If you don't touch "exec" section,
[exec.env-vars]          # it will fallback to "default-config.toml"
PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}'


[mode.main.binding]
# cmd-shift-space = 'layout floating tiling'

cmd-keypadMinus = 'resize smart -69'
cmd-keypadPlus = 'resize smart +71'

cmd-g = 'mode join'

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        1, 1, 2, ..., 9
# - Keypad numbers. keypad1, keypad1, keypad2, ..., keypad9
# - F-keys.         f2, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon, backtick,
#                   leftSquareBracket, rightSquareBracket, space, enter, esc, backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift

# cmd-enter = 'exec-and-forget open -n /Applications/kitty.app'
cmd-alt-o = 'exec-and-forget /Users/thyhaly/.config/flameshot/ocr-vi'
#cmd-m = 'exec-and-forget open -n /Volumes/Macintosh\ HD/Applications/Marta.app'

cmd-shift-m = 'macos-native-fullscreen'
cmd-m = 'fullscreen'
shift-alt-l = "exec-and-forget /usr/bin/osascript -e 'tell application \"System Events\" to keystroke \"q\" using {control down, command down}'"

alt-g = 'split horizontal'
alt-v = 'split vertical'

#cmd-h = 'focus --boundaries all-monitors-outer-frame --boundaries-action stop left'
#cmd-j = 'focus --boundaries all-monitors-outer-frame --boundaries-action stop down'
#cmd-k = 'focus --boundaries all-monitors-outer-frame --boundaries-action stop up'
#cmd-l = 'focus --boundaries all-monitors-outer-frame --boundaries-action stop right'
cmd-left = 'focus --boundaries all-monitors-outer-frame --boundaries-action stop left'
cmd-down = 'focus --boundaries all-monitors-outer-frame --boundaries-action stop down'
cmd-up = 'focus --boundaries all-monitors-outer-frame --boundaries-action stop up'
cmd-right = 'focus --boundaries all-monitors-outer-frame --boundaries-action stop right'
cmd-shift-h = 'move left'
cmd-shift-j = 'move down'
cmd-shift-k = 'move up'
cmd-shift-l = 'move right'
cmd-shift-left = 'move left'
cmd-shift-down = 'move down'
cmd-shift-up = 'move up'
cmd-shift-right = 'move right'

#cmd0 = 'summon-workspace 1'  # Notes
cmd-0 = 'workspace --auto-back-and-forth 0'  # ARZOPA / Obsidian + Spotify
cmd-alt-0 = 'workspace --auto-back-and-forth 10'  # ARZOPA
cmd-1 = 'workspace --auto-back-and-forth 1'  # Terminal
cmd-2 = 'workspace --auto-back-and-forth 2'  # Browser
cmd-3 = 'workspace --auto-back-and-forth 3'  # AltBrowser
cmd-4 = 'workspace --auto-back-and-forth 4'  # Remote
cmd-5 = 'workspace --auto-back-and-forth 5'  # Database
cmd-6 = 'workspace --auto-back-and-forth 6'
cmd-7 = 'workspace --auto-back-and-forth 7'  # Notes
cmd-8 = 'workspace --auto-back-and-forth 8'  # Games
cmd-9 = 'workspace --auto-back-and-forth 9'  # Music
#cmd1 = 'workspace --auto-back-and-forth 10' # Secrets

alt-0 = 'exec-and-forget ~/.config/aerospace/spiral-layout.sh 0'
alt-1 = 'exec-and-forget ~/.config/aerospace/spiral-layout.sh 1'
alt-2 = 'exec-and-forget ~/.config/aerospace/spiral-layout.sh 2'
alt-3 = 'exec-and-forget ~/.config/aerospace/spiral-layout.sh 3'
alt-4 = 'exec-and-forget ~/.config/aerospace/spiral-layout.sh 4'
alt-5 = 'exec-and-forget ~/.config/aerospace/spiral-layout.sh 5'
alt-6 = 'exec-and-forget ~/.config/aerospace/spiral-layout.sh 6'
alt-7 = 'exec-and-forget ~/.config/aerospace/spiral-layout.sh 7'
alt-8 = 'exec-and-forget ~/.config/aerospace/spiral-layout.sh 8'
alt-9 = 'exec-and-forget ~/.config/aerospace/spiral-layout.sh 9'
#alt1 = 'move-node-to-workspace 10'
alt-t = 'exec-and-forget ~/.config/aerospace/spiral-layout.sh t'

#cmd-tab = 'workspace-back-and-forth'
#cmd-p = 'move-workspace-to-monitor --wrap-around next'
#cmd-shift-p = [
#  'move-node-to-monitor --wrap-around next',
#  'focus-monitor next --wrap-around'
#]
#cmd-alt-h = []

cmd-shift-s = 'mode service'

[mode.service.binding]
esc = [
 'reload-config',
 'mode main'
]
r = ['flatten-workspace-tree', 'mode main'] # reset layout
#s = ['layout sticky tiling', 'mode main'] # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/3

s = [
    'exec-and-forget cat ~/.config/aerospace/shrugstring| pbcopy',
   'mode main'
]

b = [
   'exec-and-forget ~/.config/aerospace/presentation.sh on',
   'mode main'
]
shift-b = [
   'exec-and-forget ~/.config/aerospace/presentation.sh off',
   'mode main'
]

backspace = ['close-all-windows-but-current', 'mode main']

[mode.resize.binding]
keypadMinus = 'resize smart -69'
keypadPlus = 'resize smart +71'
h = ['resize width -63']
j = ['resize height -63']
k = ['resize height +65']
l = ['resize width +65']
esc = 'mode main'
enter = 'mode main'

[mode.join.binding]
h = ['join-with left', 'mode main']
j = ['join-with down', 'mode main']
k = ['join-with up', 'mode main']
l = ['join-with right', 'mode main']
cmd-h = ['join-with left', 'mode main']
cmd-alt-h = ['join-with left', 'mode main']
esc = 'mode main'
enter = 'mode main'


[[on-window-detected]]
if.window-title-regex-substring = '(?i)^picture[- ]+in[- ]+picture$'
run = ['layout floating', 'exec-and-forget ~/.config/aerospace/pip-follow.sh']

[[on-window-detected]]
if.window-title-regex-substring = '^(Developer Tools|DevTools)'
run = ['layout floating']

[[on-window-detected]]
if.window-title-regex-substring = '(?i)(sign in|log in|login|oauth|authentication|authorize|accounts\\.google\\.com)'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'dev.zed.Zed'
run = ['layout tiling', 'move-node-to-workspace 2']
check-further-callbacks = true

