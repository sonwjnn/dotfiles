# Spiral / dwindle-style tiling for new windows. The helper reads the new
# window's workspace and current parent layout, then joins it with its neighbor.
[[on-window-detected]]
if = 'true'
run = ['exec-and-forget /Users/sonwin/.config/aerospace/spiral-layout.sh']
